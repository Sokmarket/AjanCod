<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
<title id="title">AEGIS PRO splash screen</title><desc id="desc">Dark navy background, luminous shield A icon and engineering assistant branding.</desc>
