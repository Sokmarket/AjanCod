    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9BF6FF"/><stop offset=".5" stop-color="#36D9FF"/><stop offset="1" stop-color="#1478FF"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#153756"/><stop offset="1" stop-color="#050E1C"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="translate(34 8)">
