    <path d="M150 70 225 243h-34l-41-94-41 94H75Z" fill="url(#steel)" stroke="#36D9FF" stroke-width="2"/>
    <path d="M150 172 190 243h-80Z" fill="#071426" stroke="url(#cyan)" stroke-width="3"/>
    <path d="M67 105 38 118M233 105l29 13M72 259l-20 18M228 259l20 18" stroke="#36D9FF" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="354" y="167" fill="url(#steel)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="116" font-weight="800" letter-spacing="2">AEGIS</text>
  <text x="774" y="167" fill="url(#cyan)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="116" font-weight="800" letter-spacing="2">PRO</text>
