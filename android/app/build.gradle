plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.aegis.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aegis.pro'
        minSdk 24
        targetSdk 35
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        versionCode 3
        versionName '0.3.0'
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
    }
}

android.sourceSets.main {
    python.srcDir 'src/main/python'
}
